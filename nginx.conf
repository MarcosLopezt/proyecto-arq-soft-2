# Sección events
events {
    worker_connections 1024;  # Ajusta según sea necesario
}

http {
    upstream backend_users {
        least_conn;
        server backend_users:8082 max_fails=3 fail_timeout=10s;
        server backend_users_2:8086 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location /users/ {
            proxy_pass http://backend_users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
}





